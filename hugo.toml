baseurl      = "0xkohi.github.com"
title        = "Blog | kohi"
languageCode = "en-us"
theme        = "hello-friend-ng"
paginate     = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Subtitle for home (meta / title)
  homeSubtitle = "Cyber & Spiritueux"
  homeTagline = "Malware, forensics et carnet de dégustation — deux passions, un blog."

  customCSS = ["css/portal.css"]

  [[params.portals]]
    id = "cyber"
    emoji = "🛡️"
    title = "Cyber & Malware"
    blurb = "Analyses, CTI, forensics, outils et write-ups."
    url = "/cyber/posts/"
    cta = "Voir les articles →"

  [[params.portals]]
    id = "spiritueux"
    emoji = "🥃"
    title = "Whisky & Spiritueux"
    blurb = "Notes sur les bouteilles goûtées — whisky, rhum, gin…"
    url = "/spiritueux/posts/"
    cta = "Voir les dégustations →"

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable sharing buttons, if you like
  enableSharingButtons = true
  
  # Show a global language switcher in the navigation bar
  enableGlobalLanguageMenu = false

  # Metadata mostly used in document's head
  description = "My new homepage"
  keywords = "homepage, blog"
  images = [""]

  [params.footer]
    trademark = 2025
    rss = true
    copyright = false
    author = false

    topText = []
    bottomText = []

[taxonomies]
    category = "blog"
    tag      = "tags"
    series   = "series"

  # Socials media
  [[params.social]]
  name = "twitter"
  url = "https://twitter.com/0xk0hi"
  [[params.social]]
  name = "github"
  url = "https://github.com/0xkohi"

  # And you can even create generic menu

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "about/"

  [[menu.main]]
    identifier = "home"
    name       = "Accueil"
    url        = "/"

  [[menu.main]]
    identifier = "cyber"
    name       = "Cyber"
    url        = "cyber/posts/"

  [[menu.main]]
    identifier = "spiritueux"
    name       = "Spiritueux"
    url        = "spiritueux/posts/"
